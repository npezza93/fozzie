on:
  push:
    branches: [master]
  pull_request:

name: tests

jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      - name: Install toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: 1.99.0
          components: clippy
          override: true
      - uses: actions-rs/cargo@v1
        with:
          command: test
          args: --locked --all-targets
      - name: Build release and completions
        run: cargo build --locked --release
      - name: Check lints
        run: cargo clippy --locked --all-targets

  release-build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain and release target
        run: rustup toolchain install 1.99.0 --profile minimal --target ${{ matrix.target }}
      - name: Install musl linker
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build release binary and verify completions
        shell: bash
        run: |
          cargo build --locked --release --target ${{ matrix.target }}
          output="target/${{ matrix.target }}/release"
          "$output/fozzie" --version
          test -s "$output/fozzie.bash"
          test -s "$output/fozzie.fish"
          test -s "$output/_fozzie"
          bash -n "$output/fozzie.bash"
          mkdir -p package/complete
          cp "$output/fozzie" package/
          cp "$output/fozzie.bash" "$output/fozzie.fish" "$output/_fozzie" package/complete/
          tar czf fozzie-smoke.tar.gz package
          tar tzf fozzie-smoke.tar.gz
