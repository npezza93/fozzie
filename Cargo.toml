[package]
name = "fozzie"
version = "1.6.0"
authors = ["Nick Pezza <pezza@hey.com>"]
edition = "2021"
rust-version = "1.99"
license-file = "LICENSE"
description = "A quick fuzzy finder for the terminal"
repository = "https://github.com/npezza93/fozzie"

[[bin]]
name = "fozzie"
path = "src/main.rs"

[dependencies]
clap = "4.6.7"
float-cmp = "0.10.0"
termion = "4.0.6"
raw_tty = "0.1.0"
regex = "1.13.1"
terminal_size = "0.4.4"
rayon = "1.12.0"

[build-dependencies]
regex = "1.13.1"
clap = "4.6.7"
terminal_size = "0.4.4"
clap_complete = "4.6.11"
